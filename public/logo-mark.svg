<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="arokaBlueGrad" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="arokaEmeraldGrad" x1="30" y1="20" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Shield/Pebble Container (Optional soft background) -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="#0A2540" />

  <!-- Outer Interlocking 'A' Arch - Left Pillar (Royal Blue) -->
  <path d="M 22 76 L 43 24 C 45 19 50 19 52 24 L 61 46" 
        stroke="#60A5FA" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Right Pillar & Emerald Care Leaf (Emerald Green) -->
  <path d="M 50 20 C 57 20 78 50 78 76 C 68 76 60 70 54 62" 
        fill="none" 
        stroke="url(#arokaEmeraldGrad)" 
        stroke-width="8.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#subtleGlow)" />

  <!-- Central Bridge / Infinity Trade Loop (Connect & Trade) -->
  <path d="M 33 54 C 40 48 56 48 64 54 C 69 57 68 64 61 65 C 50 67 40 50 33 54 Z" 
        fill="#10B981" 
        opacity="0.95" />

  <!-- Central Core Node (Community Pulse) -->
  <circle cx="50" cy="52" r="4.5" fill="#FFFFFF" />

  <!-- Apex Vibe Spark -->
  <circle cx="50" cy="14" r="3.5" fill="#34D399" />
</svg>
