<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="emblemBlue" x1="10" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <linearGradient id="emblemEmerald" x1="30" y1="20" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (90x90) -->
  <g transform="translate(6, 5)">
    <rect x="0" y="0" width="90" height="90" rx="22" fill="#0A2540" />
    
    <!-- Left Pillar (Royal Blue) -->
    <path d="M 20 72 L 40 22 C 42 17 47 17 49 22 L 58 43" 
          stroke="#60A5FA" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Pillar & Care Leaf (Emerald) -->
    <path d="M 47 19 C 54 19 73 48 73 72 C 63 72 56 66 50 58" 
          fill="none" 
          stroke="url(#emblemEmerald)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Trade & Connection loop -->
    <path d="M 31 51 C 37 45 52 45 60 51 C 65 54 64 60 57 61 C 47 63 37 47 31 51 Z" 
          fill="#10B981" />

    <!-- Core community dot -->
    <circle cx="47" cy="49" r="4" fill="#FFFFFF" />
    <!-- Apex Spark -->
    <circle cx="47" cy="13" r="3" fill="#34D399" />
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(112, 54)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="44" 
          fill="#0A2540" 
          letter-spacing="1">AROKA</text>
  </g>

  <!-- "APP" Badge in Emerald -->
  <g transform="translate(286, 26)">
    <rect x="0" y="0" width="56" height="26" rx="6" fill="#059669" />
    <text x="28" y="18" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-weight="700" 
          font-size="13" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="1.5">APP</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(114, 80)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-weight="600" 
          font-size="11" 
          fill="#059669" 
          letter-spacing="2.8">CONNECT • TRADE • VIBE • CARE</text>
  </g>
</svg>
